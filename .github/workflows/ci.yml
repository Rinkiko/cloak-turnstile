name: ci

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: python -m build
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', *glob.glob('dist/*.whl')])"
      - name: Check installed wheel and bundled extension
        working-directory: ${{ runner.temp }}
        run: python -c "from cloak_turnstile.runner import PATCH_DIR; import cloak_turnstile; assert (PATCH_DIR / 'manifest.json').is_file(); assert (PATCH_DIR / 'script.js').is_file(); print(cloak_turnstile.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
